<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
body{margin:0;padding:16px;font-family:Roboto,Arial,sans-serif;background:var(--primary-background-color)}
:root{--primary-background-color:#fafafa;--card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#727272;--primary-color:#03a9f4;--divider-color:#e0e0e0}
body.oscuro{--primary-background-color:#111;--card-background-color:#1c1c1c;--primary-text-color:#e1e1e1;--secondary-text-color:#9b9b9b;--primary-color:#03a9f4;--divider-color:#333}
ha-card{display:block;background:var(--card-background-color);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
</style></head><body>
<script>customElements.define("ha-card",class extends HTMLElement{});customElements.define("ha-form",class extends HTMLElement{});</script>
<script type="module">
import "/pvpc-bono-social-card.js";
const p=new URLSearchParams(location.search);
if(p.get("oscuro"))document.body.classList.add("oscuro");
const estados=await (await fetch("estados.json")).json();
// Facturas en el atributo del sensor (v1.1.6+): las tres primeras calculadas con el consumo.
if(p.get("calculadas"))estados["sensor.pvpc_bs_factura_actual"].attributes.facturas=[88.4,95.1,112.7,141.3,156.9,121.5,104.2,97.8].map((v,i)=>({inicio:`2026-${String(i+2).padStart(2,"0")}-12`,fin:`2026-${String(i+3).padStart(2,"0")}-12`,total:v,real:i>=3}));
if(p.get("doce"))estados["sensor.pvpc_bs_factura_actual"].attributes.facturas=[...Array(12)].map((_,i)=>{const a=new Date(Date.UTC(2025,i+10,12));const b=new Date(Date.UTC(2025,i+11,12));return{inicio:a.toISOString().slice(0,10),fin:b.toISOString().slice(0,10),total:90+i,real:true}});
if(p.get("sin_manana"))for(const e of Object.values(estados))for(const k of Object.keys(e.attributes||{}))if(k.startsWith("price_next_day_"))delete e.attributes[k];
// «anexo=1»: comparativa guardada con datos inventados y la previsión de la CNMC (dos vistas).
let callService;
if(p.get("anexo")){
  estados["button.pvpc_bs_comparar_tarifas"]={state:"2026-10-20",attributes:{}};
  estados["sensor.pvpc_bs_mejor_alternativa"]={state:"-128.0",attributes:{fecha:"2026-10-20T21:25+02:00",estado:"ok",
    periodo:{inicio:"2026-02-12",fin:"2026-10-12",dias:242,facturas_conciliadas:8,facturas_estimadas:0},
    pagado:917.9,pagado_anual:1384.4,pagado_sin_bono:1265,pagado_sin_bono_anual:1907.9,
    pvpc_cnmc:1985.3,pvpc_cnmc_prevision:2380.1,pvpc_cnmc_prevision_bono:1825.23,total_ofertas:61,grandes_ausentes:[],
    ofertas:[{id:1,comercializadora:"Energía Ejemplo S.L.",oferta:"Tarifa Fija 24 h",importe_primer_anio:1512.4,importe_segundo_anio:1512.4,
      ahorro_anual:-128,ahorro_prevision:312.83,revision:"anual",permanencia:false,solo_nuevos_clientes:false,verde:true}],
    avisos:["pierde_bono","revision_precios","prevision_volatil","bono_termico"],veredicto:"depende_precios"}};
  callService=async()=>{};
}
const c=document.createElement("pvpc-bono-social-card");
// «stub=1»: lo que escribe HA al añadir una tarjeta nueva (getStubConfig).
c.setConfig(p.get("stub")?c.constructor.getStubConfig({states:estados}):JSON.parse(p.get("config")||"{}"));
// Recorder simulado: la estadística de facturas, una fila por factura al inicio del periodo.
const importes=[88.4,95.1,112.7,141.3,156.9,121.5,104.2,97.8];
const callWS=async(m)=>m.type==="recorder/list_statistic_ids"?[{statistic_id:"sensor.otro"},{statistic_id:"pvpc_bonosocial:facturas_prueba"}]
:{"pvpc_bonosocial:facturas_prueba":importes.map((v,i)=>({start:Date.UTC(2026,i+1,12,22),max:v,mean:v,min:v}))};
// Zona horaria de HA (?zona=Europe/Madrid); sin ella, la tarjeta usa la del navegador.
c.hass={states:estados,callService,entities:{"button.pvpc_bs_comparar_tarifas":{device_id:"d1"},"sensor.pvpc_bs_mejor_alternativa":{device_id:"d1"}},locale:{language:p.get("idioma")||"es"},language:p.get("idioma")||"es",callWS,...(p.get("zona")?{config:{time_zone:p.get("zona")}}:{})};
document.body.appendChild(c);
window.listo=true;
</script></body></html>
