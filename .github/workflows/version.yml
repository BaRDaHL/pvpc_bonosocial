# Una release solo vale si su etiqueta (vX.Y.Z) coincide con la versión del manifest.json;
# si no, HACS anuncia actualizaciones que no existen (o no anuncia las que sí).
name: Versión

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  # Para volver a adjuntar el zip a una release si el job «zip» falló.
  workflow_dispatch:
    inputs:
      etiqueta:
        description: "Etiqueta de la release (vX.Y.Z)"
        required: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.etiqueta || github.ref }}
      - name: La etiqueta coincide con el manifest.json
        env:
          ETIQUETA: ${{ inputs.etiqueta || github.event.release.tag_name || github.ref_name }}
        run: |
          VERSION=$(jq -r .version custom_components/pvpc_bonosocial/manifest.json)
          if [ "v$VERSION" != "$ETIQUETA" ]; then
            echo "::error::La etiqueta $ETIQUETA no coincide con la versión $VERSION del manifest.json"
            exit 1
          fi
          echo "Etiqueta $ETIQUETA = manifest $VERSION"

  # Con «zip_release» en hacs.json, HACS instala el zip adjunto a la release y cuenta sus
  # descargas. Solo se adjunta si la etiqueta coincide con el manifest (job anterior).
  zip:
    needs: version
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.etiqueta || github.event.release.tag_name }}
      - name: Empaquetar custom_components/pvpc_bonosocial
        run: |
          cd custom_components/pvpc_bonosocial
          zip -r -X "$GITHUB_WORKSPACE/pvpc_bonosocial.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/pvpc_bonosocial.zip" | tail -1
      - name: Adjuntar a la release
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ inputs.etiqueta || github.event.release.tag_name }}
        run: gh release upload "$ETIQUETA" pvpc_bonosocial.zip --clobber
